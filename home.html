<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sample Website</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      color: #333;
    }

    header {
      background-color: #4f46e5;
      color: white;
      padding: 20px;
      text-align: center;
    }

    nav {
      margin-top: 10px;
    }

    nav a {
      color: white;
      margin: 0 10px;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }

    section {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    footer {
      background-color: #e5e7eb;
      text-align: center;
      padding: 15px;
    }

    button {
      background-color: #4f46e5;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #4338ca;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <h1>My Sample Website Prod</h1>
    <p>Welcome to my HTML page</p>

    <nav>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <!-- BODY / MAIN CONTENT -->
  <main>
    <section id="home">
      <h2>Home</h2>
      <p>This is the main content area of the website.</p>
      <button onclick="showMessage()">Click Me</button>
      <p id="message"></p>
    </section>

    <section id="about">
      <h2>About</h2>
      <p>This section describes the website.</p>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <p>Email: example@email.com</p>
    </section>
  </main>

  <!-- FOOTER -->
  <footer>
    <p>© 2025 My Sample Website. All rights reserved.</p>
  </footer>

  <script>
    function showMessage() {
      document.getElementById("message").textContent =
        "Button clicked successfully!";
    }
  </script>

</body>
</html>
